<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diện tích hình tròn – mẫu cắt trên giấy màu (A4)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1f2933;
    --muted: #5f6b76;
    --bg: #e8ecf0;
    --card: #ffffff;
    --border: #d5dbe1;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: "Be Vietnam Pro", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }

  /* Thanh công cụ – chỉ hiện trên màn hình */
  .toolbar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 20px; background: rgba(232, 236, 240, .94); border-bottom: 1px solid var(--border); backdrop-filter: blur(6px); }
  .toolbar .name { font-weight: 600; font-size: 14px; margin-right: auto; }
  .ctl { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; background: var(--card); padding: 2px; }
  .seg button { font: inherit; font-size: 13px; border: 0; background: transparent; color: var(--muted); padding: 5px 11px; border-radius: 6px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .print { font: inherit; font-size: 13px; border: 1px solid var(--ink); background: var(--ink); color: #fff; border-radius: 8px; padding: 7px 14px; cursor: pointer; }
  .print:hover, .seg button:hover { filter: brightness(.96); }
  .hint { width: 100%; margin: 0; font-size: 12px; line-height: 1.5; color: var(--muted); }
  @media (max-width: 720px) { .toolbar .name { width: 100%; } }

  /* Tờ A4 */
  .sheets { display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 24px 16px 56px; }
  .sheet { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .sheet-label { width: 210mm; max-width: 100%; font-size: 13px; line-height: 1.45; color: var(--muted); }
  .sheet-label b { color: var(--ink); font-weight: 600; }
  .page { position: relative; flex: none; width: 210mm; height: 297mm; background: var(--paper, #fff); overflow: hidden; box-shadow: 0 1px 2px rgba(16, 24, 40, .08), 0 10px 30px rgba(16, 24, 40, .10); }
  .page svg { position: absolute; left: 0; top: 0; width: 210mm; height: 297mm; }

  /* In: chỉ ra nét đứt, không nền, không chữ */
  @page { size: A4 portrait; margin: 0; }
  @media print {
    html, body { background: transparent; }
    .toolbar, .sheet-label { display: none; }
    .sheets { display: block; padding: 0; zoom: 1 !important; }
    .sheet { display: block; }
    .sheet + .sheet { break-before: page; }
    .page { box-shadow: none; background: transparent !important; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <div class="name">Diện tích hình tròn · mẫu cắt trên giấy màu (A4)</div>
  <div class="ctl">Số hình quạt
    <div class="seg" id="segN" role="group" aria-label="Số hình quạt mỗi hình tròn">
      <button type="button" data-v="8">8</button>
      <button type="button" data-v="10">10</button>
      <button type="button" data-v="12">12</button>
      <button type="button" data-v="16">16</button>
    </div>
  </div>
  <button type="button" class="print" onclick="window.print()">In / Lưu PDF</button>
  <p class="hint">Tờ 1 in trên giấy màu thứ nhất, tờ 2 in trên giấy màu thứ hai · khổ A4 · tỉ lệ 100% (không chọn “Vừa trang / Fit”). Màu nền trên màn hình chỉ để xem trước — khi in chỉ ra nét đứt.</p>
</div>

<main class="sheets" id="sheets"></main>

<script>
(function () {
  'use strict';

  /* ===== Thông số (mm) ===== */
  var NS = 'http://www.w3.org/2000/svg';
  var R = 50;            // bán kính 5 cm
  var STRIP_W = 157;     // nửa chiều dài: 31,4 cm : 2 = 15,7 cm
  var STRIP_H = 50;      // chiều rộng = bán kính 5 cm
  var DASH = 2.4, GAP = 1.6;   // nét đứt
  var LINE = 0.4, CUT = '#1a1a1a';

  // vị trí trên tờ A4 (căn giữa theo chiều dọc)
  var CX = 105, CY = 84.5;
  var SX = (210 - STRIP_W) / 2, SY1 = 152.5, SY2 = 212.5;

  var SHEETS = [
    { paper: '#F6BE95', halve: true,
      label: function (n) { return '<b>Tờ 1 · giấy màu thứ nhất</b> (vd. cam): hình tròn chia ' + n + ' hình quạt, có thêm 1 nét cắt đôi hình quạt trên cùng → ' + (n - 1) + ' hình quạt + 2 nửa. Hai dải 15,7 × 5 cm nối lại thành hình chữ nhật 31,4 × 5 cm.'; } },
    { paper: '#BFDDAE', halve: false,
      label: function (n) { return '<b>Tờ 2 · giấy màu thứ hai</b> (vd. xanh lá): hình tròn chia ' + n + ' hình quạt. Hai dải 15,7 × 5 cm nối lại thành hình chữ nhật 31,4 × 5 cm.'; } }
  ];

  var state = { n: 10 };

  function f(x) { return Math.round(x * 1000) / 1000; }
  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    if (attrs) for (var k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }

  // nét đứt bắt đầu và kết thúc bằng 1 gạch → góc và tâm đều có nét
  function dashLine(g, x1, y1, x2, y2) {
    var L = Math.hypot(x2 - x1, y2 - y1);
    var k = Math.max(1, Math.round((L - DASH) / (DASH + GAP)));
    el('line', { x1: f(x1), y1: f(y1), x2: f(x2), y2: f(y2), pathLength: f(k * (DASH + GAP) + DASH), 'stroke-dasharray': DASH + ' ' + GAP }, g);
  }
  function dashCircle(g, cx, cy, r) {
    var k = Math.round(2 * Math.PI * r / (DASH + GAP));
    el('circle', { cx: cx, cy: cy, r: r, pathLength: f(k * (DASH + GAP)), 'stroke-dasharray': DASH + ' ' + GAP }, g);
  }
  function dashRect(g, x, y, w, h) {
    dashLine(g, x, y, x + w, y);
    dashLine(g, x + w, y, x + w, y + h);
    dashLine(g, x + w, y + h, x, y + h);
    dashLine(g, x, y + h, x, y);
  }

  var sheetsEl = document.getElementById('sheets');

  function buildSheet(spec, n, idx) {
    var wrap = document.createElement('div');
    wrap.className = 'sheet';
    var lab = document.createElement('div');
    lab.className = 'sheet-label';
    lab.innerHTML = spec.label(n);
    wrap.appendChild(lab);
    var sec = document.createElement('section');
    sec.className = 'page';
    sec.style.setProperty('--paper', spec.paper);
    var svg = el('svg', { viewBox: '0 0 210 297', width: '210mm', height: '297mm', role: 'img', 'aria-label': 'Tờ ' + (idx + 1) + ': hình tròn chia ' + n + ' hình quạt và 2 dải hình chữ nhật, nét đứt để cắt' });
    var g = el('g', { fill: 'none', stroke: CUT, 'stroke-width': LINE, 'stroke-linecap': 'butt' }, svg);

    // hình tròn r = 5 cm, chia n hình quạt (hình quạt đầu tiên nằm chính giữa phía trên)
    dashCircle(g, CX, CY, R);
    var step = 360 / n, rad = Math.PI / 180;
    for (var k = 0; k < n; k++) {
      var a = (-90 - step / 2 + k * step) * rad;
      dashLine(g, CX + R * Math.cos(a), CY + R * Math.sin(a), CX, CY);   // từ mép vào tâm
    }
    if (spec.halve) dashLine(g, CX, CY - R, CX, CY);                      // nét cắt đôi hình quạt trên cùng

    // 2 nửa hình chữ nhật 15,7 × 5 cm
    dashRect(g, SX, SY1, STRIP_W, STRIP_H);
    dashRect(g, SX, SY2, STRIP_W, STRIP_H);

    sec.appendChild(svg);
    wrap.appendChild(sec);
    sheetsEl.appendChild(wrap);
  }

  function render() {
    sheetsEl.innerHTML = '';
    SHEETS.forEach(function (s, i) { buildSheet(s, state.n, i); });
    document.querySelectorAll('#segN button').forEach(function (b) { b.setAttribute('aria-pressed', String(+b.dataset.v === state.n)); });
    fit();
  }

  // thu nhỏ cho vừa màn hình hẹp (không ảnh hưởng khi in)
  function fit() {
    var w = document.documentElement.clientWidth;
    var z = Math.min(1, (w - 32) / (210 * 96 / 25.4));
    sheetsEl.style.zoom = z < 1 ? String(Math.round(z * 1000) / 1000) : '';
  }
  window.addEventListener('resize', fit);

  document.querySelectorAll('#segN button').forEach(function (b) {
    b.addEventListener('click', function () { state.n = +b.dataset.v; render(); });
  });

  render();
})();
</script>
<script src="../assets/back.js"></script>
</body>
</html>
