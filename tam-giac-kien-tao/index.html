<style>
  :root {
    --tri: #066cb6;        /* màu tam giác (lấy từ ảnh gốc) */
    --line: #ffffff;       /* đường chia giữa các miếng */
    --desk: #e6e9ed;
    --border: #d3d8de;
    --ink: #1f2933;
    --muted: #5f6b76;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--desk); color: var(--ink); }
  body { font-family: "Be Vietnam Pro", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }

  .toolbar { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; padding: 16px 16px 0; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; background: #fff; padding: 2px; }
  .seg button, .print { font: inherit; font-size: 13px; border: 0; background: transparent; color: var(--muted); padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--tri); color: #fff; }
  .print { border: 1px solid var(--border); background: #fff; color: var(--ink); border-radius: 8px; padding: 7px 14px; }

  /* Mỗi tờ = 1 trang A4 ngang (297 x 210 mm). Kích thước bên trong tính theo mm của tờ (--mm) */
  .sheets { display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 16px; }
  .sheet-wrap { width: min(297mm, 100%); container-type: inline-size; }
  .sheet {
    --mm: calc(100cqw / 297);
    width: 100%; aspect-ratio: 297 / 210; overflow: hidden;
    background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 6px 20px rgba(0,0,0,.06);
    padding: calc(7 * var(--mm));
    display: flex; flex-direction: column; position: relative;
  }
  .pageno { position: absolute; right: calc(7 * var(--mm)); bottom: calc(2.2 * var(--mm)); font-size: calc(2.6 * var(--mm)); color: var(--muted); }

  .grid { display: grid; grid-template-columns: repeat(3, calc(90 * var(--mm))); justify-content: center;
           column-gap: calc(5 * var(--mm)); row-gap: calc(4 * var(--mm)); flex: 1; align-content: center; }
  .card { margin: 0; }
  .frame { aspect-ratio: 1.07; background: #fff; border: max(0.5px, calc(0.25 * var(--mm))) solid var(--border); border-radius: calc(2 * var(--mm)); overflow: hidden; }
  .frame svg { display: block; width: 100%; height: 100%; }
  .frame path { fill: var(--tri); stroke: var(--line); stroke-width: max(0.6px, calc(0.5 * var(--mm))); stroke-linejoin: round; vector-effect: non-scaling-stroke; shape-rendering: geometricPrecision; }
  figcaption { margin-top: calc(1.2 * var(--mm)); text-align: center; font-size: calc(3.8 * var(--mm)); line-height: 1.2; color: var(--muted); }

  @page { size: A4 landscape; margin: 0; }
  @media print {
    html, body { background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .toolbar { display: none; }
    .sheets { display: block; padding: 0; }
    .sheet-wrap { width: 297mm; break-after: page; }
    .sheet-wrap:last-child { break-after: auto; }
    .sheet { height: 209.5mm; aspect-ratio: auto; box-shadow: none; }
  }
</style>
